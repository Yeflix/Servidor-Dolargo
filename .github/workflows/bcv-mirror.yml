name: bcv-mirror

on:
  schedule:
    - cron: "3,23,43 * * * *"
  workflow_dispatch:          # botón "Run workflow" para probar a mano

# Solo lee el repositorio; escribe en Firestore con la cuenta de servicio.
permissions:
  contents: read

concurrency:
  group: bcv-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # v5 usan el runtime node24 (las v4 corren en node20, ya sin soporte).
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Scrapear BCV y publicar en Firestore
        run: node scripts/bcv-mirror.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          BCV_PIN_SHA256: ${{ vars.BCV_PIN_SHA256 }}
